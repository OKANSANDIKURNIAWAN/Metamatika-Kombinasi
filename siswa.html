<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kombinasi - Matematika</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      /* palette: Sky, Lavender, Butter, Matcha, Pink, Tangerine */
      --ink:#1F1D2B; --krem:#FFF8E6; --biru:#7FB9E6; --ungu:#D6BEEA; --kuning:#F4D77A; --pink:#F98BA9;
      --hijau:#B7C96A; --oranye:#FF8F45;
      --font:"Fredoka","Trebuchet MS",system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0}
    body{font-family:var(--font);color:var(--ink);min-height:100vh;background:var(--krem)}

    /* ===== anti-copy: teks soal tidak bisa di-highlight/diseleksi ===== */
    body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
    /* cegah seleksi & tarik teks + tekan popup salin long-press di HP */
    html,body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    /* kolom login tetap bisa diketik & diedit siswa */
    input,textarea,[contenteditable="true"]{-webkit-user-select:text;-moz-user-select:text;user-select:text;-webkit-touch-callout:default}
    button{font-family:inherit;color:inherit;cursor:pointer}
    :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
    .app{width:100%;min-height:100vh;display:flex;flex-direction:column}
    .app[hidden]{display:none!important}
    .garis{border:3px solid var(--ink)}

    /* ===== header ===== */
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
      background:var(--biru);border:3px solid var(--ink);border-radius:0;padding:14px 18px;position:relative;z-index:2}
    .chip{display:inline-flex;align-items:center;gap:8px;background:#EAF7FF;border:3px solid var(--ink);border-radius:999px;
      font-weight:600;font-size:clamp(15px,2vw,22px);padding:6px 18px;line-height:1.1}
    .chip svg{width:26px;height:26px}
    .chip.who{background:var(--kuning);font-size:clamp(13px,1.7vw,18px)}
    .home{width:48px;height:48px;border-radius:12px;background:var(--pink);border:3px solid var(--ink);display:grid;place-items:center}
    .home svg{width:28px;height:28px}

    /* ===== badan (layar penuh) ===== */
    .badan{flex:1;display:flex;background:var(--krem);border:0;border-top:3px solid var(--ink);
      border-radius:0;overflow:hidden}
    .papan{flex:1;display:flex;flex-direction:column;padding:14px;min-width:0}

    /* bar atas papan */
    .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--biru);border:3px solid var(--ink);
      border-radius:18px;padding:10px 14px}
    .soal-chip{background:var(--kuning);display:inline-flex;align-items:center;gap:8px;border:3px solid var(--ink);
      border-radius:14px;font-weight:700;font-size:clamp(17px,2.2vw,24px);padding:6px 16px;white-space:nowrap}
    .soal-chip svg{width:26px;height:26px}
    .prog{flex:1;min-width:110px;height:22px;background:var(--krem);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
    .prog i{display:block;height:100%;width:8%;background:var(--ungu);border-right:3px solid var(--ink);transition:width .4s}
    .stat{display:flex;flex-direction:column;gap:5px}
    .pill{display:inline-flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:12px;font-weight:600;
      font-size:15px;line-height:1;padding:5px 12px;white-space:nowrap}
    .pill svg{width:18px;height:18px;flex:none}
    .pill.skor{background:var(--hijau)}
    .pill.beruntun{background:var(--oranye)}
    .acak{background:var(--pink);border:3px solid var(--ink);border-radius:12px;font-weight:600;font-size:15px;padding:9px 14px;
      display:inline-flex;align-items:center;gap:6px;transition:transform .12s}
    .acak:hover{transform:translateY(-2px) rotate(-1deg)}
    .acak svg{width:20px;height:20px}
    .tip{display:flex;align-items:center;gap:10px;background:var(--krem);border:3px solid var(--ink);border-radius:18px;
      padding:8px 14px;font-weight:500;font-size:14px;line-height:1.2}
    .tip svg{width:26px;height:26px;flex:none}

    /* kartu */
    .grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(130px,1fr);gap:14px;margin-top:14px}
    .kartu{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
      background:var(--c);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 rgba(31,29,43,.35);
      padding:8px;transition:transform .15s,box-shadow .15s}
    .kartu:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 10px 0 rgba(31,29,43,.35)}
    .kartu:active:not(:disabled){transform:translateY(2px);box-shadow:0 3px 0 rgba(31,29,43,.35)}
    .kartu .no{font-size:clamp(46px,min(8vw,14vh),120px);font-weight:700;line-height:1;color:#fff;
      -webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
    .kartu .lbl{background:var(--krem);border:3px solid var(--ink);border-radius:999px;font-weight:600;font-size:clamp(11px,1.3vw,15px);padding:2px 16px}
    .kartu .dk{position:absolute;width:clamp(18px,2.4vw,30px);height:clamp(18px,2.4vw,30px);pointer-events:none}
    .kartu .dk.tl{top:8%;left:8%}.kartu .dk.tr{top:8%;right:8%}.kartu .dk.bl{bottom:22%;left:8%}.kartu .dk.br{bottom:22%;right:8%}
    .kartu:disabled{cursor:default;filter:saturate(.45) brightness(1.05)}
    .kartu .tanda{position:absolute;top:-10px;right:-10px;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);
      display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--hijau)}
    .kartu .tanda.salah{background:var(--pink)}
    .grid.kocok .kartu{animation:kocok .45s}
    @keyframes kocok{30%{transform:rotate(-4deg) scale(.94)}70%{transform:rotate(4deg) scale(.94)}}

    /* dialog soal */
    dialog{margin:auto;width:min(92vw,560px);background:var(--krem);color:var(--ink);border:3px solid var(--ink);
      border-radius:24px;padding:22px;box-shadow:0 8px 0 rgba(31,29,43,.4)}
    dialog::backdrop{background:rgba(31,29,43,.55)}
    dialog h2{font-size:15px;font-weight:600;background:var(--kuning);display:inline-block;border:3px solid var(--ink);
      border-radius:999px;padding:3px 16px;margin-bottom:12px}
    dialog .tanya{font-size:clamp(20px,3vw,26px);font-weight:600;line-height:1.25;margin-bottom:16px}
    .opsi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .opsi button{background:#fff;border:3px solid var(--ink);border-radius:14px;font-size:20px;font-weight:600;padding:12px;
      transition:transform .12s,background .12s}
    .opsi button:hover:not(:disabled){transform:translateY(-2px);background:#EAF7FF}
    .opsi button.benar{background:var(--hijau)}
    .opsi button.salah{background:var(--pink)}
    .opsi button.pilih{background:var(--kuning);box-shadow:inset 0 0 0 3px var(--ink);transform:translateY(-2px)}
    .opsi button.pilih:hover:not(:disabled){background:var(--kuning)}
    .opsi button:disabled{cursor:default}
    .umpan{min-height:28px;font-weight:600;font-size:16px;line-height:1.35;margin:14px 0 6px}
    .umpan b{font-weight:700}
    .umpan.ok{background:rgba(183,201,106,.45);border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
    .umpan.no{background:rgba(249,139,169,.45);border:3px solid var(--ink);border-radius:14px;padding:10px 12px}
    .konfirmasi{background:var(--hijau);border:3px solid var(--ink);border-radius:999px;font-weight:700;font-size:16px;padding:9px 26px;
      box-shadow:0 4px 0 rgba(31,29,43,.35);transition:transform .12s,box-shadow .12s}
    .konfirmasi:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(31,29,43,.35)}
    .konfirmasi:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(31,29,43,.35)}
    .konfirmasi[hidden]{display:none}
    .tutup{background:var(--biru);border:3px solid var(--ink);border-radius:999px;font-weight:700;font-size:16px;padding:9px 26px}
    .tutup[hidden]{display:none}

    /* layar login & akhir */
    .layar{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px;overflow:auto;background:var(--krem)}
    .layar[hidden]{display:none!important}
    .kotak{width:min(92vw,430px);background:var(--krem);border:3px solid var(--ink);border-radius:24px;padding:26px;box-shadow:0 8px 0 rgba(31,29,43,.4)}
    .kotak .ikon{width:64px;height:64px;border-radius:18px;background:var(--pink);border:3px solid var(--ink);display:grid;place-items:center;font-size:30px;box-shadow:0 4px 0 rgba(31,29,43,.35)}
    .kotak h1{font-size:34px;font-weight:700;line-height:1;margin:12px 0 4px}
    .kotak p.sub{font-weight:500;margin-bottom:16px;line-height:1.3}
    .kotak label{display:block;font-weight:700;margin:12px 0 6px}
    .kotak input{width:100%;font:inherit;font-weight:600;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 14px;outline:none}
    .kotak input.err{border-color:#FF4949;background:#ffe1e1}
    .pesan{min-height:22px;font-weight:700;color:#c2181f;margin-top:10px}
    .tombol{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;
      border:3px solid var(--ink);border-radius:14px;padding:12px 20px;transition:transform .12s,box-shadow .12s}
    .tombol:hover{transform:translateY(-2px)}
    .tombol:active{transform:translateY(2px)}
    .tombol.utama{width:100%;background:var(--pink);font-size:18px;margin-top:14px}
    .kotak.akhir{text-align:center;width:min(94vw,780px);max-height:92vh;overflow:auto}
    .kotak.akhir .nilai{font-size:clamp(56px,16vw,96px);font-weight:700;line-height:1;margin:10px 0 4px;color:var(--ink);
      -webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
    .kotak.akhir .sub2{font-weight:600;line-height:1.4;margin-bottom:18px}

    /* ===== review / riwayat jawaban (neubrutalism) ===== */
    .kotak.akhir h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.1;margin:12px 0 4px}
    .akhir-aksi{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:4px}
    .akhir-aksi .tombol{flex:1 1 180px}
    .tombol.neo{background:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 0 #000;border-radius:0}
    .tombol.neo:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 #000}
    .tombol.neo:active{transform:translate(3px,3px);box-shadow:0 0 0 0 #000}
    .tombol.neo.ungu{background:var(--ungu)}
    .tombol.neo.biru{background:var(--biru)}

    .reviewBlok{margin-top:22px;text-align:left;border-top:4px solid var(--ink);padding-top:20px}
    .reviewBlok h2{background:none;border:0;padding:0;margin:0 0 4px;font-size:clamp(20px,3.4vw,26px);font-weight:700;display:block}
    .reviewSub{font-weight:600;font-size:14px;line-height:1.35;margin-bottom:16px}
    .reviewList{display:flex;flex-direction:column;gap:18px}
    .reviewItem{background:#fff;border:4px solid var(--ink);border-radius:0;box-shadow:4px 4px 0 0 #000;
      padding:16px;display:flex;flex-direction:column;gap:10px}
    .reviewHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .reviewNo{border:3px solid var(--ink);border-radius:0;font-weight:700;font-size:14px;line-height:1;padding:6px 12px;
      background:var(--kuning);box-shadow:3px 3px 0 0 #000}
    .reviewBadge{border:4px solid var(--ink);border-radius:0;font-weight:700;font-size:14px;line-height:1;padding:7px 14px;letter-spacing:.5px}
    .reviewBadge.ok{background:var(--hijau);color:var(--ink)}
    .reviewBadge.no{background:#FF4949;color:#fff}
    .reviewSoal{font-weight:600;font-size:clamp(15px,2vw,18px);line-height:1.4}
    .reviewOpsi{display:flex;flex-direction:column;gap:9px}
    .revOpt{border:3px solid var(--ink);border-radius:0;background:#fff;padding:9px 12px;font-weight:600;font-size:15px;line-height:1.3}
    .revOpt.kunci{background:var(--hijau)}
    .revOpt.pilih-salah{background:var(--pink)}
    .revTandai{font-weight:700;margin-left:8px;white-space:nowrap}
    .reviewFoot{display:flex;align-items:flex-start;gap:10px;border:3px solid var(--ink);border-radius:0;
      padding:10px 12px;font-size:14px;font-weight:500;line-height:1.35;background:var(--krem)}
    .reviewFoot .lbl{font-weight:700;flex:none}

    /* cheat modal */
    #cheatModal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(31,29,43,.85);padding:20px;margin:0;width:auto;border:0;box-shadow:none}
    #cheatModal[hidden]{display:none!important}
    #cheatModal::backdrop{background:rgba(31,29,43,.85)}
    #cheatModal .kotak{text-align:center}
    #cheatModal .punca{width:84px;height:84px;margin:0 auto;animation:shk .6s infinite}
    @keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

    /* confetti */
    .conf{position:fixed;top:-20px;width:12px;height:16px;border:2px solid var(--ink);z-index:70;pointer-events:none;animation:cf 1.6s ease-in forwards}
    @keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}

    /* responsif */
    @media (max-width:900px){
      .grid{grid-template-columns:repeat(3,1fr)}
      .top{justify-content:center}
    }
    @media (max-width:560px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .tip{width:100%}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bt" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 9.2l7.1-.6z" style="fill:var(--c,#F4D77A);stroke:#1F1D2B;stroke-width:1.8;stroke-linejoin:round"/></symbol>
  <symbol id="pl" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" style="fill:none;stroke:var(--c,#fff);stroke-width:5;stroke-linecap:round"/></symbol>
  <symbol id="sg" viewBox="0 0 24 24"><path d="M12 22L3 4h18z" style="fill:var(--c,#F98BA9);stroke:#1F1D2B;stroke-width:1.8;stroke-linejoin:round" transform="rotate(180 12 12) scale(.8) translate(3 3)"/></symbol>
  <symbol id="sp" viewBox="0 0 24 24"><path d="M12 1.5C12.8 7.5 16.5 11.2 22.5 12 16.5 12.8 12.8 16.5 12 22.5 11.2 16.5 7.5 12.8 1.5 12 7.5 11.2 11.2 7.5 12 1.5z" style="fill:var(--c,#fff);stroke:#1F1D2B;stroke-width:1.6;stroke-linejoin:round"/></symbol>
  <symbol id="sq" viewBox="0 0 24 24"><path d="M2 14c3-9 6-9 9 0s6 9 9 0" style="fill:none;stroke:var(--c,#F98BA9);stroke-width:3.4;stroke-linecap:round"/></symbol>
  <symbol id="cd" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 5l-4 14" style="fill:none;stroke:#1F1D2B;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"/></symbol>
  <symbol id="wn" viewBox="0 0 24 24"><path d="M12 3.2L22 20.2H2z" style="fill:var(--c,#FF4949);stroke:#1F1D2B;stroke-width:2;stroke-linejoin:round"/><path d="M12 10v4.2" style="fill:none;stroke:#1F1D2B;stroke-width:2.6;stroke-linecap:round"/><circle cx="12" cy="17.4" r="1.4" style="fill:#1F1D2B"/></symbol>
  <symbol id="hg" viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3c0 4 5 5 5 9 0-4 5-5 5-9M7 21c0-4 5-5 5-9 0 4 5 5 5 9" style="fill:none;stroke:#1F1D2B;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"/><path d="M9.5 18h5l-2.5-2.5z" style="fill:#F4D77A;stroke:#1F1D2B;stroke-width:1.4;stroke-linejoin:round"/></symbol>
</svg>

<!-- ===== LOGIN ===== -->
<section class="layar" id="login">
  <div class="kotak">
    <div class="ikon">✦</div>
    <h1>Kombinasi</h1>
    <p class="sub">Latihan 10 soal matematika. Isi data dulu, lalu jawab soal-soalnya.</p>

    <label for="nm">Nama</label>
    <input id="nm" autocomplete="name" placeholder="Contoh: Rani Singh">
    <label for="ab">No. presensi</label>
    <input id="ab" inputmode="numeric" maxlength="3" placeholder="Contoh: 12">
    <div id="lm" class="pesan" role="alert" aria-live="polite"></div>
    <button id="start" class="tombol utama" type="button">Mulai latihan</button>
  </div>
</section>

<!-- ===== APP / GAME ===== -->
<div class="app" id="app" hidden>
  <header class="top">
    <span class="chip"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#bt"/></svg>Matematika Peluang Kombinasi</span>
    <span class="chip who" id="who"></span>
    <span class="chip">XII SIJA 2</span>
    <a class="home" href="#" aria-label="Beranda">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1F1D2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
    </a>
  </header>

  <div class="badan">
    <main class="papan">
      <div class="bar">
        <span class="soal-chip"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#bt"/></svg><span id="chipSoal">Soal 0/10</span></span>
        <div class="prog" role="progressbar" aria-label="Kemajuan" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="prog"><i id="progIsi"></i></div>

        <!-- Skor ditaruh di atas Beruntun -->
        <div class="stat">
          <span class="pill skor"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#bt"/></svg>Skor <b id="skor">0</b>/<span id="totalSkor">10</span></span>
          <span class="pill beruntun"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z" fill="#F4D77A" stroke="#1F1D2B" stroke-width="1.8" stroke-linejoin="round"/></svg>Beruntun <b id="beruntun">0</b></span>
        </div>

        <button class="acak" id="acak" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1F1D2B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h4c4 0 6 10 10 10h4M3 17h4c1.500 0 2.700-1 3.700-2.500M14 8.500C15 7.500 16 7 17 7h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>Acak Kartu
        </button>
        <div class="tip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.500c.8.800 1 1.500 1 2.500h6c0-1 .2-1.700 1-2.500A6 6 0 0 0 12 3z" fill="#F4D77A" stroke="#1F1D2B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Pilih kartu<br>soal yang tersedia!</span>
        </div>
      </div>

      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<!-- ===== DIALOG SOAL ===== -->
<dialog id="dlg" aria-labelledby="dlgJudul">
  <h2 id="dlgJudul"></h2>
  <p class="tanya" id="tanya"></p>
  <div class="opsi" id="opsi"></div>
  <p class="umpan" id="umpan" role="status" aria-live="polite"></p>
  <button class="konfirmasi" id="konfirmasi" type="button" hidden>Konfirmasi Jawaban</button>
  <button class="tutup" id="tutup" type="button" hidden>Lanjut</button>
</dialog>

<!-- ===== END ===== -->
<section class="layar" id="end" hidden>
  <div class="kotak akhir">
    <h1 id="endt"></h1>
    <div class="nilai" id="en"></div>
    <p class="sub2" id="ed"></p>
    <div class="akhir-aksi">
      <button id="again" class="tombol neo ungu" type="button">Ulangi Kuis</button>
      <button id="beranda" class="tombol neo biru" type="button">Kembali ke Beranda</button>
    </div>

    <!-- ===== REVIEW / RIWAYAT JAWABAN ===== -->
    <section class="reviewBlok" id="reviewBlok" hidden aria-labelledby="reviewJudul">
      <h2 id="reviewJudul">Review Jawaban</h2>
      <p class="reviewSub" id="reviewRingkas"></p>
      <div class="reviewList" id="reviewList"></div>
    </section>
  </div>
</section>

<!-- ===== CHEAT MODAL ===== -->
<div id="cheatModal" hidden role="alertdialog" aria-modal="true" aria-labelledby="cheatTitle"></div>

<script>
  /* =========================================================
     10 SOAL KOMBINASI MATEMATIKA
     Format: [teks soal, [pilihan... jawaban benar di indeks 0], pembahasan, simbol]
     Soal 1-5  : kombinasi biasa (stok unik)  -> C(n, r) = n! / (r! (n - r)!)

  let fsGraceUntil = 0;       // grace period agar transisi fullscreen tidak dianggap curang

  let suppressBlurCheck = false; // jeda sesaat saat kita sendiri yang mengubah fullscreen

  /* beri jeda singkat agar perubahan fullscreen tidak memicu blokir*/
  function grantFocusGrace(ms) {
    fsGraceUntil = Date.now() + (ms || 1200);
  }

  function focusGraceActive() {
    return Date.now() < fsGraceUntil;
  }

  function isFullscreen() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.msFullscreenElement
    );
  }

  /* masuk mode layar penuh (dipanggil dari gesture klik tombol Mulai/Ulangi) */
  async function requestFullscreenLock() {
    const el = document.documentElement;
    if (isFullscreen() || !el) return;
    suppressBlurCheck = true;
    grantFocusGrace(1500);
    try {
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: "hide" });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    } catch (err) {
      console.warn("Fullscreen ditolak browser:", err);
    } finally {
      setTimeout(() => { suppressBlurCheck = false; }, 1500);
    }
  }

  /* keluar mode layar penuh dengan aman (tanpa memicu blokir) */
  function exitFullscreenLock() {
    if (!isFullscreen()) return;
    suppressBlurCheck = true;
    grantFocusGrace(1200);
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.msExitFullscreen) document.msExitFullscreen();
    } catch (err) {
      console.warn("Gagal keluar fullscreen:", err);
    } finally {
      setTimeout(() => { suppressBlurCheck = false; }, 1200);
    }
  }

      .on("postgres_changes",
        { event: "UPDATE", schema: "public", table: "participants", filter: "id=eq." + activeParticipantId },
        payload => {
          const newStatus = payload.new ? String(payload.new.status || "").toLowerCase() : "";
          if (newStatus === "active") resumeAfterUnblock();
          else if (newStatus === "blocked" && quizActive && !cheatBlocked) showCheatWarning();
        })
      .subscribe();

    document.querySelectorAll("#opsi button").forEach((b, k) => {

    S.riwayat[n] = i;   // simpan riwayat jawaban siswa untuk nomor ini
    if (ok) { S.score++; S.streak++; S.best = Math.max(S.best, S.streak); confetti() } else S.streak = 0;

      const pilih = (typeof data.pick === "number") ? data.pick : -1;
      const statusCls = data.ok ? "ok" : "no";
      const statusTxt = data.ok ? "BENAR ✓" : "SALAH ✗";

      const opsiHtml = opts.map((o, k) => {
        const kunci = !!o.ok;
        const dipilih = k === pilih;
        let cls = "revOpt", tandai = "";
        if (kunci) { cls += " kunci"; }
        if (dipilih && !kunci) { cls += " pilih-salah"; }
        if (dipilih) tandai += `<span class="revTandai">Jawabanmu</span>`;
        if (kunci) tandai += `<span class="revTandai">Kunci</span>`;
        return `<div class="${cls}">${escapeHtml(o.t)}${tandai}</div>`;
      }).join("");

      return `<article class="reviewItem">
        <div class="reviewHead">
          <span class="reviewNo">Soal ${n + 1}</span>
          <span class="reviewBadge ${statusCls}">${statusTxt}</span>
        </div>
        <p class="reviewSoal">${escapeHtml(q[0])}</p>
        <div class="reviewOpsi">${opsiHtml}</div>
        <div class="reviewFoot"><span class="lbl">Pembahasan:</span><span>${escapeHtml(q[2])}</span></div>
      </article>`;
    }).join("");

    $("reviewBlok").hidden = false;
  }

  function finish() {
    const s = S.score;
    const nilai = s * 9 + 10;
    quizActive = false;
    exitFullscreenLock();
    $("endt").textContent = s >= 9 ? "Luar biasa, " + S.n + "!" : s >= 6 ? "Bagus, " + S.n + "!" : "Tetap semangat, " + S.n + "!";
    $("en").textContent = nilai;
    $("ed").innerHTML = `Benar <b>${s}</b> dari ${N} soal.<br>Nilai kamu <b>${nilai}</b>. Rekor beruntun ${S.best} soal.<br>No. presensi ${S.a}.`;
    renderReview();
    if (!cheatBlocked) updateParticipant(S.id, { status: "finished", "Score/Nilai": nilai });
    show("end");
    if (s >= 6) for (let i = 0; i < 3; i++) setTimeout(confetti, i * 400);
  }

  /* ===== event ===== */
  $("start").onclick = async () => {
    const n = $("nm").value.trim(), a = $("ab").value.trim();
    ["nm", "ab"].forEach(i => $(i).classList.remove("err"));
    if (n.length < 2) { return bad("nm", "Nama belum diisi. Ketik nama lengkapmu.") }
    if (!/^\d{1,3}$/.test(a)) { return bad("ab", "No. presensi harus angka, contoh: 12.") }
    initState();
    urut = [...Array(N).keys()];
    S.n = n; S.a = a;
    $("totalSkor").textContent = N;
    $("who").textContent = n + " · No. " + a;
    $("reviewBlok").hidden = true; $("reviewList").innerHTML = "";
    S.id = await insertParticipant(n, a);
    activeParticipantId = S.id;
    activeParticipantName = n;
    quizActive = true;
    cheatBlocked = false;
    hideCheatWarning();
    subscribeParticipantStatus();
    await requestFullscreenLock();
    papan(); statistik(); show("app")
  };

  ["nm", "ab"].forEach(i => $(i).addEventListener("keydown", e => { if (e.key === "Enter") $("start").click() }));

  function bad(id, m) {
    $("lm").textContent = m;
    const e = $(id);
    e.classList.add("err");
    void e.offsetWidth;
    e.focus();
    e.addEventListener("input", () => e.classList.remove("err"), { once: true });
  }

  $("grid").addEventListener("click", e => { const k = e.target.closest(".kartu"); if (k && !k.disabled) buka(+k.dataset.n); });
  $("opsi").addEventListener("click", e => { const b = e.target.closest("button"); if (b && !b.disabled) pilih(+b.dataset.i); });
  $("konfirmasi").addEventListener("click", () => jawab(pilihan));
  $("tutup").addEventListener("click", () => $("dlg").close());
  $("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close() });
  $("dlg").addEventListener("close", () => {
    pilihan = -1;
    $("konfirmasi").hidden = true;
    aktif = -1;
    if (Object.keys(S.done).length === N) finish();
  });

  $("acak").addEventListener("click", () => {
    for (let i = urut.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[urut[i], urut[j]] = [urut[j], urut[i]]; }
    const g = $("grid"); g.classList.remove("kocok"); void g.offsetWidth; g.classList.add("kocok");
    papan();
  });

  $("again").onclick = async () => {
    const n = S.n, a = S.a;
    initState(); urut = [...Array(N).keys()]; S.n = n; S.a = a;
    $("reviewBlok").hidden = true; $("reviewList").innerHTML = "";
    teardownParticipantChannel();
    activeParticipantId = null; activeParticipantName = null;
    cheatBlocked = false; hideCheatWarning();
    S.id = await insertParticipant(n, a);
    activeParticipantId = S.id;
    activeParticipantName = n;
    quizActive = true;
    subscribeParticipantStatus();
    await requestFullscreenLock();
    papan(); statistik(); show("app")
  };

  /* ===== Kembali ke Beranda: reset state kuis dengan bersih ===== */
  $("beranda").onclick = () => {
    quizActive = false;
    cheatBlocked = false;
    exitFullscreenLock();
    hideCheatWarning();
    teardownParticipantChannel();
    activeParticipantId = null; activeParticipantName = null;
    initState();
    urut = [...Array(N).keys()];
    $("reviewBlok").hidden = true; $("reviewList").innerHTML = "";
    $("grid").innerHTML = "";
    $("nm").value = ""; $("ab").value = "";
    $("lm").textContent = "";
    $("nm").classList.remove("err"); $("ab").classList.remove("err");
    $("who").textContent = "";
    show("login");
    setTimeout(() => $("nm").focus(), 50);
  };

  function confetti() {
    const cs = ["#FFE600", "#00E5FF", "#FF2ED1", "#00FF66", "#FF4949"];
    for (let i = 0; i < 36; i++) {
      const d = document.createElement("i"); d.className = "conf";
      d.style.left = Math.random() * 100 + "vw"; d.style.background = cs[i % 5];
      d.style.animationDelay = Math.random() * .4 + "s"; d.style.borderRadius = i % 2 ? "50%" : "2px";
      document.body.appendChild(d); setTimeout(() => d.remove(), 2400)
    }
  }

  /* ===== init tampilan ===== */
  $("totalSkor").textContent = N;
  show("login");
</script>
</body>

</html>
